name: Model inference test Fiji latest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout latest JDLL legacy
        uses: actions/checkout@v4
        with:
          repository: bioimage-io/JDLL
          ref: legacy
          path: ci-sources/jdll

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Use source-built JDLL with published SAMJ
        run: python .github/scripts/fiji_ci.py configure

      - name: Build JDLL and plugin with published SAMJ
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s .github/scripts -p test_fiji_ci.py -v
          mkdir -p ci-bundle/plugin
          mvn -B -ntp -f ci-sources/jdll/pom.xml clean install
          mvn -U -B -ntp clean package
          mvn -nsu -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.6.1:copy-dependencies \
            -DincludeScope=runtime -DincludeTypes=jar -Dmdep.useRepositoryLayout=true \
            -DoutputDirectory="$GITHUB_WORKSPACE/ci-bundle/jars"
          PLUGIN_NAME=$(mvn -B -q help:evaluate -Dexpression=project.build.finalName -DforceStdout -Dstyle.color=never)
          cp "target/$PLUGIN_NAME.jar" ci-bundle/plugin/
          python .github/scripts/fiji_ci.py bundle
          cat ci-bundle/manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test jars
        uses: actions/upload-artifact@v4
        with:
          name: fiji-test-bundle
          path: ci-bundle/
          if-no-files-found: error
          retention-days: 7

  integration-tests:
    needs: build-test-bundle
    name: SAM2 Tiny (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            archive: fiji-latest-linux64-jdk.zip
            launcher: fiji-linux-x64
          - name: windows-x64
            os: windows-2022
            archive: fiji-latest-win64-jdk.zip
            launcher: fiji-windows-x64.exe
          - name: macos-arm64
            os: macos-15
            archive: fiji-latest-macos-arm64-jdk.zip
            launcher: fiji-macos-arm64
          - name: macos-x64
            os: macos-15-intel
            archive: fiji-latest-macos64-jdk.zip
            launcher: fiji-macos-x64

    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download test jars
        uses: actions/download-artifact@v4
        with:
          name: fiji-test-bundle
          path: ci-bundle

      - name: Download Fiji and test image
        timeout-minutes: 20
        shell: bash
        env:
          FIJI_ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p test-output
          BASE_URL=https://downloads.imagej.net/fiji/latest
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 \
            "$BASE_URL/$FIJI_ARCHIVE" -o fiji.zip
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 120 \
            https://imagej.net/images/blobs.gif -o test-output/input.gif

      - name: Prepare fresh Fiji
        env:
          FIJI_LAUNCHER: ${{ matrix.launcher }}
        run: python .github/scripts/fiji_ci.py prepare

      - name: Install SAM2 Tiny from scratch and export prompted mask
        run: python .github/scripts/fiji_ci.py run

      - name: Upload mask, provenance and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam2-tiny-${{ matrix.name }}
          path: test-output/
          if-no-files-found: warn
          retention-days: 14
